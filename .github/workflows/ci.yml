name: CI

# Builds the Xiaomi AX3000E (qualcommax/ipq50xx, mainline kernel) image from
# this branch. Fork-only: upstream OpenWrt has its own CI; this file and
# .github/ax3000e.diffconfig are not meant for submission.

on:
  workflow_dispatch:
  push:
    branches:
      - 'ax3000e-*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      FORCE_UNSAFE_CONFIGURE: 1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget time coccinelle python3-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp .github/ax3000e.diffconfig .config
          echo "CONFIG_VERSIONOPT=y" >> .config
          echo "CONFIG_VERSION_FILENAMES=y" >> .config
          echo "CONFIG_VERSION_NUMBER=\"ci-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}\"" >> .config
          echo "CONFIG_VERSION_CODE=\"${GITHUB_SHA:0:8}\"" >> .config
          make defconfig
          ./scripts/diffconfig.sh | grep -E "CONFIG_TARGET_(qualcommax|DEVICE)" || true

      - name: Download sources
        run: make -j"$(nproc)" download V=s 2>&1 | tail -20

      - name: Build
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: List images
        run: |
          ls -la bin/targets/qualcommax/ipq50xx/
          sha256sum bin/targets/qualcommax/ipq50xx/*ax3000e* || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi_ax3000e-${{ github.sha }}
          path: |
            bin/targets/qualcommax/ipq50xx/*xiaomi_ax3000e*
            bin/targets/qualcommax/ipq50xx/*.manifest
            bin/targets/qualcommax/ipq50xx/sha256sums
          if-no-files-found: error
